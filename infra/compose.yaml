services:
  postgres:
    image: postgres:17.6-alpine
    container_name: workmesh-postgres
    environment:
      POSTGRES_USER: workmesh
      POSTGRES_PASSWORD: workmesh
      POSTGRES_DB: workmesh
    ports:
      - "5432:5432"
    volumes:
      - workmesh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workmesh -d workmesh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workmesh_pgdata:
