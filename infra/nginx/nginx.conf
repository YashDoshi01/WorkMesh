# WorkMesh gateway: the single public entry point.
#
#   browser / SDK / curl ---> NGINX :8080 ---+---> api-1 :3000 ---+
#                                            |                    +--> PostgreSQL
#                                            +---> api-2 :3000 ---+
#
# What NGINX does here: terminates client connections, load-balances across API instances,
# retries a failed instance, enforces size/time/rate limits, stamps every request with an id,
# tells the API the real client address, and serves the dashboard's static files.
# What it deliberately does NOT do: TLS (terminate it in front of this, or add certificates here),
# or any application logic. See docs/GATEWAY.md for the reasoning behind each choice.
#
# Open-source NGINX has PASSIVE health checking only: it learns an instance is down when real
# requests to it fail. It does not poll /readyz (that needs NGINX Plus). Keep that in mind below.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;               # do not advertise the NGINX version
  # Redirects must be RELATIVE. NGINX listens on 8080 inside the container, but the outside world
  # reaches it on whatever port Docker publishes (or 80/443 behind another proxy). An absolute
  # Location would embed the internal port and send the browser somewhere unreachable.
  absolute_redirect off;

  # ----------------------------------------------------------------------------- logging
  # One JSON object per request. `request_id` is the SAME id the API logs, so a request can be
  # followed across both. `upstream` and `served_by` show which instance answered; a retry shows
  # two addresses ("a, b"). Upstream timings are strings because retries make them lists.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","client":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_s":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_s":"$upstream_response_time","served_by":"$upstream_http_x_served_by",'
    '"limit":"$limit_req_status"}';
  access_log /dev/stdout json;

  # ------------------------------------------------------------------- rate limiting
  # Counters live in NGINX shared memory and are keyed by client address. There is ONE NGINX in
  # front of ALL API instances, so these limits are global across them, which per-API-process
  # counters could never be. If you run several NGINX nodes, each keeps its own counters and the
  # effective limit is multiplied by the node count (see docs/GATEWAY.md).
  #
  # These limit REQUEST RATE per address. They do not count failed sign-ins, so they slow a
  # password-guessing client but are not a lockout. Behind Docker Desktop on Windows/macOS every
  # local client appears as one address, so locally these act as one shared budget.
  limit_req_zone $binary_remote_addr zone=machine:10m    rate=200r/s;  # workers, SDKs, customer apps
  limit_req_zone $binary_remote_addr zone=operator:10m   rate=20r/s;   # dashboard
  limit_req_zone $binary_remote_addr zone=auth_probe:1m  rate=10r/m;   # "is this API key valid?"
  # Sign-up, sign-in, invitation links: tight, because these are what password guessing targets.
  limit_req_zone $binary_remote_addr zone=auth_login:2m  rate=30r/m;
  limit_req_status 429;
  limit_req_log_level warn;
  limit_conn_zone $binary_remote_addr zone=per_address:10m;
  limit_conn per_address 200;
  limit_conn_status 429;

  # ----------------------------------------------------------- timeouts and size limits
  # Slow clients are the cheapest way to exhaust a server, so every phase of a request has a bound.
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;
  keepalive_timeout 30s;           # idle client connections
  # The API accepts 128 KiB bodies (a 64 KiB payload plus JSON overhead). NGINX is slightly
  # above that, so the API's own, more precise error is what a client normally sees; anything
  # larger is refused here before it ever reaches a Node process.
  client_max_body_size 256k;
  large_client_header_buffers 4 8k;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml;  # static assets only, not API JSON

  # ------------------------------------------------------------------------ upstream
  # least_conn: send each request to the instance with the fewest requests in progress.
  # Round robin would also work for uniform requests, but request cost here is NOT uniform
  # (a stats query takes ~40 ms, a heartbeat ~2 ms); least_conn keeps a slow request from
  # piling more work on the instance that is already busy.
  #
  # max_fails/fail_timeout is the passive health check: after 2 failed requests within 10 s an
  # instance is skipped for 10 s, then tried again. 2 (not 1) so one unlucky request does not
  # take an instance out of rotation.
  #
  # keepalive: reuse connections to the API instead of opening one per request. The API's own
  # idle timeout (65 s) is deliberately LONGER than keepalive_timeout here (60 s): if the API
  # closed an idle connection first, NGINX could send a request down it and the client would get
  # a 502. (See apps/api/src/server.ts.)
  #
  # zone: puts the balancing counters AND the failure counts in shared memory. Without it each
  # NGINX worker process keeps its own copy, so an instance would have to fail max_fails times
  # *per worker* before being skipped, which weakens the passive health check. (Distribution
  # itself was already even without it: 21/19 over 40 requests; with it 20/20.)
  upstream workmesh_api {
    zone workmesh_api 64k;
    least_conn;
    server api-1:3000 max_fails=2 fail_timeout=10s;
    server api-2:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
  }

  server {
    listen 8080;
    server_name _;

    # JSON error bodies for failures that NGINX itself produces, in the API's own error shape,
    # so a client has one format to parse. $request_id lets the user quote it in a bug report.
    error_page 413 @too_large;
    error_page 429 @rate_limited;
    error_page 502 @bad_gateway;
    error_page 503 @unavailable;
    error_page 504 @gateway_timeout;

    location @too_large {
      default_type application/json;
      add_header X-Request-Id $request_id always;
      return 413 '{"error":{"code":"payload_too_large","message":"Request body is too large","requestId":"$request_id"}}';
    }
    location @rate_limited {
      default_type application/json;
      add_header X-Request-Id $request_id always;
      add_header Retry-After 1 always;
      return 429 '{"error":{"code":"rate_limited","message":"Too many requests; slow down and retry","requestId":"$request_id"}}';
    }
    location @bad_gateway {
      default_type application/json;
      add_header X-Request-Id $request_id always;
      return 502 '{"error":{"code":"bad_gateway","message":"The API did not answer correctly","requestId":"$request_id"}}';
    }
    location @unavailable {
      default_type application/json;
      add_header X-Request-Id $request_id always;
      return 503 '{"error":{"code":"unavailable","message":"No API instance is available","requestId":"$request_id"}}';
    }
    location @gateway_timeout {
      default_type application/json;
      add_header X-Request-Id $request_id always;
      return 504 '{"error":{"code":"gateway_timeout","message":"The API took too long to answer","requestId":"$request_id"}}';
    }

    # ----------------------------------------------------------------- gateway's own health
    # For Docker/orchestrators. Not proxied: it says only that NGINX itself is up.
    location = /gateway-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # ----------------------------------------------------------------- the operator plane
    # Sign-in probe: tight limit. 10/minute with a burst of 5 is plenty for a person typing a key.
    location = /ops/me {
      limit_req zone=auth_probe burst=5 nodelay;
      include /etc/nginx/snippets/proxy.conf;
    }
    location ^~ /ops/ {
      limit_req zone=operator burst=40 nodelay;
      include /etc/nginx/snippets/proxy.conf;
    }

    # ------------------------------------------------------------------ the customer app API
    # Cookie-authenticated calls made by the dashboard (sign-in, then everything for ONE organisation).
    #
    # The tight limit applies ONLY to the endpoints that take a credential, which are what password
    # guessing targets. It must not cover "who am I?" (/auth/session, /auth/me), which the app calls
    # on every page load: people behind one office address would lock each other out by browsing.
    # (A regex location is used on purpose: a `^~` prefix would stop regex locations from matching.)
    location ~ ^/app/auth/(login|signup|accept-invite|invite-info)$ {
      limit_req zone=auth_login burst=10 nodelay;
      include /etc/nginx/snippets/proxy.conf;
    }
    location /app/ {
      limit_req zone=operator burst=40 nodelay;
      include /etc/nginx/snippets/proxy.conf;
    }

    # ------------------------------------------------------------------ the machine plane
    # Workers, the SDK and customer applications. Generous limit: many workers can share one
    # address (a customer NAT), and each polls about once a second.
    location ~ ^/(jobs|workflows|schedules|workers|healthz|readyz)(/|$) {
      limit_req zone=machine burst=400 nodelay;
      include /etc/nginx/snippets/proxy.conf;
    }

    # ------------------------------------------------------------------------- the dashboard
    # Static files from the build output. Same origin as the API, so the browser needs no CORS.
    location = / {
      return 302 /dashboard/;
    }
    location /dashboard/ {
      root /usr/share/nginx/html;
      include /etc/nginx/snippets/security-headers.conf;
      include /etc/nginx/snippets/dashboard-csp.conf;
      add_header Cache-Control "no-cache" always;          # index.html: always revalidate
      try_files $uri /dashboard/index.html;                # any app route -> the single-page app
    }
    location /dashboard/assets/ {
      root /usr/share/nginx/html;
      include /etc/nginx/snippets/security-headers.conf;
      include /etc/nginx/snippets/dashboard-csp.conf;
      # File names contain a content hash, so a changed file has a new name: cache them forever.
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Anything else.
    location / {
      default_type application/json;
      add_header X-Request-Id $request_id always;
      return 404 '{"error":{"code":"not_found","message":"No such route","requestId":"$request_id"}}';
    }
  }
}
