# Content Security Policy for the dashboard. The API key lives in sessionStorage, readable by any
# script on the page, so the strongest defence is to forbid every script that did not come from
# this origin: no inline scripts, no third-party hosts, no eval.
#  - style-src 'self': React sets styles through the DOM (element.style), which this allows,
#    so no 'unsafe-inline' is needed.
#  - img-src data:  : the favicon is an inline data: URI.
#  - connect-src 'self': the page may only talk to its own origin (the API sits behind it).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
