# Shared by every location that forwards to the API.

proxy_pass http://workmesh_api;

# HTTP/1.1 and an empty Connection header are what allow the upstream `keepalive` pool to work.
proxy_http_version 1.1;
proxy_set_header Connection "";

# Identity of the request.
#  X-Request-Id: ALWAYS generated here, overwriting any client-supplied value, so a client cannot
#    forge or collide ids. The API logs it and echoes it back, so one id spans NGINX and the API.
#  X-Forwarded-For: set to the address NGINX saw, REPLACING anything the client sent. NGINX is the
#    first hop we trust, so what the client claims about itself is not evidence. (The API only
#    believes this header from NGINX's own address; see TRUST_PROXY.)
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Time bounds. connect is short: a healthy instance on the same network accepts at once, and a
# dead one should be given up on quickly so the retry below can happen.
proxy_connect_timeout 2s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;

# If an instance fails, try ONE other instance, but only for failures where retrying is safe:
#  - "error"/"timeout": could not connect, or lost the connection.
#  - http_502/503/504: the instance itself reported being unable to serve.
# NGINX will not resend a POST/PATCH once the request body has been sent to an instance (that
# could run an operation twice: POST /jobs has no idempotency key yet). A POST is retried only if
# the connection failed BEFORE anything was sent, which is always safe.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 5s;

# Let the API's own error bodies (JSON, with its own codes) pass through untouched.
proxy_intercept_errors off;

include /etc/nginx/snippets/security-headers.conf;
