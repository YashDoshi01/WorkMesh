# Cheap, always-on browser protections. (`always` so they are also sent on error responses.)
add_header X-Content-Type-Options "nosniff" always;       # never guess a content type
add_header X-Frame-Options "DENY" always;                  # cannot be embedded in another site
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
